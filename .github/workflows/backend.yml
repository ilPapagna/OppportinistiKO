name: Backend verification
on:
  push:
    paths: ['backend/**', '.github/workflows/backend.yml', 'js/**']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml', 'js/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: radice
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: radice_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U radice -d radice_test'
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd 'redis-cli ping'
          --health-interval 5s --health-timeout 5s --health-retries 20
      s3:
        image: localstack/localstack:4.9.2
        env:
          SERVICES: s3
          AWS_DEFAULT_REGION: eu-west-1
        ports: ['9000:4566']
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://radice:disposable-ci-password@localhost:5432/radice_test
      REDIS_URL: redis://localhost:6379/1
      APP_ORIGIN: http://localhost:3000
      COOKIE_SECURE: 'false'
      # Disposable test fixture keys, never production credentials.
      DATA_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
      OTP_PEPPER: ci-only-test-fixture-pepper-never-production
      SMTP_HOST: localhost
      S3_BUCKET: radice-private
      S3_REGION: eu-west-1
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      S3_FORCE_PATH_STYLE: 'true'
      ZOOM_ACCOUNT_ID: test-account
      ZOOM_CLIENT_ID: test-client
      ZOOM_CLIENT_SECRET: test-secret
      ZOOM_WEBHOOK_SECRET: test-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run migrate
      - name: Initialize disposable S3 bucket
        run: node scripts/init-test-s3.mjs
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
